[project]
name = "rm6116-graphrag"
version = "0.1.0"
description = "GraphRAG pipeline over the RM6116 Network Services 3 Framework Agreement"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-documentai>=2.29",
  "google-cloud-storage>=2.16",
  "google-genai>=1.0",
  "neo4j>=5.20",
  "langchain-neo4j>=0.1",
  "langgraph>=0.2",
  "langsmith>=0.1",
  "pydantic>=2.7",
  "mcp>=1.2",
  "tenacity>=8.3",
  "rapidfuzz>=3.9",
  "pyyaml>=6",
  "pypdf>=4.2",
  "python-dotenv>=1.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
